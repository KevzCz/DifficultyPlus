plugins {
    id "me.modmuss50.mod-publish-plugin" version "2.1.1"
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    modImplementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"

    modImplementation "curse.maven:dungeon-difficulty-645559:$rootProject.dungeon_difficulty_neoforge"

    modCompileOnly("curse.maven:puffish-skills-835091:$rootProject.puffish_skills_neoforge") { transitive = false }

    modCompileOnly("curse.maven:xaeros-minimap-263420:$rootProject.xaero_minimap_neoforge") { transitive = false }
    modCompileOnly("curse.maven:xaeros-world-map-317780:$rootProject.xaero_worldmap_neoforge") { transitive = false }

    modCompileOnly "me.shedaniel.cloth:cloth-config-neoforge:$rootProject.cloth_config_version"
    modLocalRuntime "me.shedaniel.cloth:cloth-config-neoforge:$rootProject.cloth_config_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

publishMods {
    dryRun = gradle.startParameter.taskNames.any { it.contains("publishModsDry") }

    file = tasks.remapJar.archiveFile
    displayName = "Difficulty+ [NEOFORGE] [${rootProject.minecraft_version}] - [${project.version}]"
    type = STABLE
    modLoaders.add("neoforge")

    def changelogFile = rootProject.file("CHANGELOG.md")
    def changelogText = changelogFile.exists() ? changelogFile.text : ""
    changelog = changelogText.trim().isEmpty() ? "No changelog provided." : changelogText

    curseforge {
        projectId = "1636332"
        accessToken = providers.gradleProperty("cfToken")
            .orElse(providers.environmentVariable("CF_TOKEN"))
        minecraftVersions.add("1.21.1")
        javaVersions.add(JavaVersion.VERSION_21)
        clientRequired = true
        serverRequired = true
    }

    modrinth {
        projectId = "zbD8ULDT"
        accessToken = providers.gradleProperty("modrinthToken")
            .orElse(providers.environmentVariable("MODRINTH_TOKEN"))
        minecraftVersions.add("1.21.1")
        environment = CLIENT_AND_SERVER
    }
}

tasks.register("publishModsDry", Copy) {
    group = "upload"
    description = "Dry run of publishMods — writes to build/unified-dry/ instead of uploading."

    def publishTasks = tasks.withType(me.modmuss50.mpp.PublishModTask)
    dependsOn publishTasks

    from(publishTasks.collect { it.dryRunDirectory }) {
        include "**/*.jar"
    }
    into rootProject.layout.buildDirectory.dir("unified-dry")
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

tasks.named("publishMods") { group = "upload" }
tasks.withType(me.modmuss50.mpp.PublishModTask).configureEach {
    group = "upload"
}
